<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AgriStack</title>
    
    <!-- Global Styles -->
    <link rel="stylesheet" href="css/global.css">
    
    <!-- Component Styles -->
    <link rel="stylesheet" href="css/register.css">
</head>
<body>

    <!-- Main Content -->
    <main class="register-main">
        <div class="register-container">
            <div class="register-wrapper">
                <!-- Register Form -->
                <div class="register-panel" id="register-panel">
                    <div class="register-form-header">
                        <h2>Create Account</h2>
                        <p>Join AgriStack and start shopping</p>
                    </div>

                    <form class="register-form" id="register-form">
                        <div class="register-form-row">
                            <div class="register-form-group">
                                <label for="register-fname">First Name</label>
                                <input 
                                    type="text" 
                                    id="register-fname" 
                                    name="firstname" 
                                    placeholder="First name"
                                    required
                                >
                            </div>

                            <div class="register-form-group">
                                <label for="register-lname">Last Name</label>
                                <input 
                                    type="text" 
                                    id="register-lname" 
                                    name="lastname" 
                                    placeholder="Last name"
                                    required
                                >
                            </div>
                        </div>

                        <div class="register-form-group">
                            <label for="register-email">Email Address</label>
                            <input 
                                type="email" 
                                id="register-email" 
                                name="email" 
                                placeholder="Enter your email"
                                required
                            >
                        </div>

                     

                        <div class="register-form-group">
                            <label for="register-password">Password</label>
                            <input 
                                type="password" 
                                id="register-password" 
                                name="password" 
                                placeholder="Create a password"
                                required
                            >
                        </div>

                        <div class="register-form-group">
                            <label for="register-confirm">Confirm Password</label>
                            <input 
                                type="password" 
                                id="register-confirm" 
                                name="confirm_password" 
                                placeholder="Confirm your password"
                                required
                            >
                        </div>

                        <div class="register-form-checkbox">
                            <label>
                                <input type="checkbox" name="terms" required>
                                <span>I agree to the <a href="#" target="_blank">Terms of Service</a> and <a href="#" target="_blank">Privacy Policy</a></span>
                            </label>
                        </div>

                        <button type="submit" class="register-btn-submit">Create Account</button>
                    </form>

                    <div class="register-form-footer">
                        <p>Already have an account? <a href="login.html">Sign In</a></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script>
        // Register Form Submission
        document.getElementById('register-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const firstName = document.getElementById('register-fname').value;
            const lastName = document.getElementById('register-lname').value;
            const email = document.getElementById('register-email').value;
            
            // Store in localStorage for demo
            localStorage.setItem('user_email', email);
            localStorage.setItem('user_name', firstName + ' ' + lastName);
            localStorage.setItem('is_logged_in', 'true');
            
            // Redirect to account page
            window.location.href = 'account.html';
        });
    </script>
</body>
</html>
